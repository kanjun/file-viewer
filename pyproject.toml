[project]
name = "file-viewer"
version = "0.1.0"
description = "Browse and view files from the workspace data/ tree with markdown rendering and pretty-printed JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "markdown>=3.5",
    "pygments>=2.17",
]

[project.scripts]
file-viewer = "file_viewer.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file_viewer"]
